<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>/* meeting mode v3 - big switch, 6 zone labels + roster, Keldi -> Oʻyladi -> Qildi -> Natija card, counters strip (spec 2026-10-24, F2: text >= 22 px at 1600 px) */
:root { --ink: #2b241f; --cream: #fbf4ea; --ai: #2f8cff; --bad: #d8452f; --good: #2fbf71; --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #d9e6ee; font-family: var(--font); user-select: none; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; }
#dim { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.4s; }
#zones, #tags { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
#tags { z-index: 4; }

#legend { position: fixed; left: 1.6vw; top: 2.4vh; z-index: 6; display: flex; gap: 1em;
  font: 800 max(22px, 1.6vw)/1 var(--font); color: var(--ink); background: rgba(251, 244, 234, 0.94); padding: 0.4em 0.7em; border-radius: 999px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
#legend .li { display: inline-flex; align-items: center; gap: 0.35em; }
#legend i { width: 1.4em; height: 1.4em; display: block; }
#legend i svg { width: 100%; height: 100%; display: block; }
#legend i.ai { filter: drop-shadow(0 0 0.3em #4fb4ff); }

#switch { position: fixed; left: 50%; top: 2.2vh; transform: translateX(-50%); z-index: 7; cursor: pointer; display: flex; align-items: center; gap: 0.5em;
  font: 800 max(26px, 2.1vw)/1 var(--font); color: #fff; background: #5a4e47; border: 0; padding: 0.35em 0.6em 0.35em 0.8em; border-radius: 999px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3); transition: background 0.3s, box-shadow 0.3s; }
#switch .knob { width: 2.4em; height: 1.3em; border-radius: 999px; background: rgba(255, 255, 255, 0.25); position: relative; }
#switch .knob i { position: absolute; top: 0.15em; left: 0.15em; width: 1em; height: 1em; border-radius: 50%; background: #fff; transition: left 0.25s; }
#switch #swState { min-width: 4.6em; text-align: center; background: var(--bad); padding: 0.2em 0.5em; border-radius: 999px; }
#switch.on { background: #1f5fae; box-shadow: 0 0 1.4em rgba(79, 180, 255, 0.9); }
#switch.on .knob i { left: 1.25em; }
#switch.on #swState { background: var(--ai); }

#clock { position: fixed; right: 1.6vw; top: 2.4vh; z-index: 6; font: 800 max(24px, 1.8vw)/1 var(--font); font-variant-numeric: tabular-nums; color: var(--ink); background: rgba(251, 244, 234, 0.9); padding: 0.25em 0.45em; border-radius: 0.3em; }
#pause { position: fixed; right: 1.6vw; top: 9vh; z-index: 6; opacity: 0; font: 800 max(22px, 1.5vw)/1 var(--font); color: #fff; background: #a0522d; padding: 0.35em 0.7em; border-radius: 999px; }

.zl { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 0.4em; white-space: nowrap; cursor: pointer; border: 0; transition: opacity 0.3s;
  font: 800 max(22px, 1.55vw)/1 var(--font); color: var(--ink); background: rgba(251, 244, 234, 0.96); padding: 0.35em 0.55em; border-radius: 0.5em; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
.zl .zk { font-size: 0.75em; color: #fff; background: var(--ink); border-radius: 0.3em; padding: 0.15em 0.4em; }
.zl .zc { font-size: 0.9em; color: #fff; padding: 0.15em 0.4em; border-radius: 0.3em; }
.zl .zc.bad { background: var(--bad); } .zl .zc.good { background: var(--good); }
.zl.sel { box-shadow: 0 0 0 0.15em var(--ai), 0 6px 20px rgba(0, 0, 0, 0.25); }

.tg { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; will-change: transform;
  font: 800 max(24px, 1.7vw)/1 var(--font); padding: 0.4em 0.7em; border-radius: 0.5em; color: var(--ink); background: var(--cream); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28); }
.tg .pb { display: none; }
.tg.say { background: #fff; }
.tg.ai { color: #fff; background: var(--ai); box-shadow: 0 0 0.9em rgba(79, 180, 255, 0.85); }
.tg.done { color: #fff; background: var(--good); }
.tg.star { color: #7a3d00; background: #ffd45e; box-shadow: 0 0 0.9em rgba(79, 180, 255, 0.85); }
.tg.note { background: #ffe37a; }
.tg.warn { color: #fff; background: #e8742a; }
.tg.bad { color: #fff; background: var(--bad); box-shadow: 0 0 0.9em rgba(216, 69, 47, 0.7); }
.tg.bar { background: #fff; padding-bottom: 0.5em; }
.tg.bar .pb, .tg.star .pb { display: block; margin-top: 0.3em; height: 0.35em; background: #eadfd2; border-radius: 99px; overflow: hidden; }
.tg.bar .pb b { display: block; height: 100%; background: #e8742a; }
.tg.star .pb b { display: block; height: 100%; background: var(--ai); } /* the lead card fills (sim props.cardFill) */
/* thought bubble over the robot (F1): icon (a lit bulb, CSS only) + <= 3 words */
.tg.think { color: #12305c; background: #e8f3ff; border: 0.14em solid var(--ai); border-radius: 1.2em; padding-left: 2.1em; box-shadow: 0 0 1em rgba(79, 180, 255, 0.8); }
.tg.think::before { content: ""; position: absolute; left: 0.6em; top: 50%; width: 0.95em; height: 0.95em; margin-top: -0.6em; border-radius: 50% 50% 45% 45%; background: #ffc83d; box-shadow: 0 0 0.5em #ffd84a, 0 0.55em 0 -0.25em #8a6a2a; }
.tg.think::after { content: ""; position: absolute; left: 50%; bottom: -0.75em; width: 0.5em; height: 0.5em; border-radius: 50%; background: #e8f3ff; border: 0.12em solid var(--ai); }

#card { position: fixed; left: 2.2vw; top: 50%; z-index: 6; width: 40vw; opacity: 0; transform: translateY(-50%) scale(0.96); transition: opacity 0.35s, transform 0.35s;
  background: #fff; color: var(--ink); border-radius: 0.8vw; padding: 1.2vw 1.4vw; box-shadow: 0 12px 44px rgba(0, 0, 0, 0.35); pointer-events: none; }
#card.show { opacity: 1; transform: translateY(-50%) scale(1); }
#card .ch { display: flex; justify-content: space-between; align-items: center; gap: 0.5em; font: 800 max(30px, 2.1vw)/1.1 var(--font); margin-bottom: 0.4em; }
#cardAi { font-size: 0.6em; color: #fff; padding: 0.3em 0.6em; border-radius: 999px; white-space: nowrap; }
#cardAi.on { background: var(--ai); } #cardAi.off { background: var(--bad); }
#card .row { display: flex; align-items: baseline; gap: 0.6em; padding: 0.35em 0.5em; border-radius: 0.4em; font: 700 max(24px, 1.6vw)/1.2 var(--font); color: #8a7f76; }
#card .row b { flex: 0 0 4.3em; font-weight: 800; }
#card .row.past { color: #4a4038; }
#card .row.cur { color: var(--ink); background: #e8f3ff; box-shadow: inset 0.25em 0 0 var(--ai); }
#card .row.bad span { color: var(--bad); }
#card .row.good span { color: #1d8a50; }
#card .row.bad.cur { background: #fde8e4; box-shadow: inset 0.25em 0 0 var(--bad); }
#card .cf { margin-top: 0.5em; text-align: right; }
/* roster (addendum 2026-10-24): who works here, one line each, never scrolls */
#card .rs { margin-top: 0.6em; padding-top: 0.5em; border-top: 2px solid #eadfd2; }
#rosterHead { font: 800 max(22px, 1.35vw)/1.2 var(--font); color: var(--ai); margin-bottom: 0.25em; }
#card .rl { font: 600 max(22px, 1.3vw)/1.25 var(--font); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#card .rl b { font-weight: 800; margin-right: 0.3em; }
#card .rl span { color: #6a5f57; }
#total { position: fixed; left: 1.6vw; top: calc(2.4vh + max(22px, 1.6vw) * 2.35); z-index: 6; transition: opacity 0.3s;
  font: 800 max(20px, 1.25vw)/1 var(--font); color: var(--ink); background: rgba(251, 244, 234, 0.94); padding: 0.35em 0.7em; border-radius: 999px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); }
#cardTag, #ctTag { font: 800 max(14px, 0.9vw)/1 var(--font); letter-spacing: 0.1em; color: #fff; background: #a0522d; padding: 0.4em 0.7em; border-radius: 999px; }

#counters { position: fixed; left: 50%; bottom: 2.4vh; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 1.2em; white-space: nowrap;
  font: 800 max(22px, 1.45vw)/1 var(--font); color: var(--ink); background: rgba(251, 244, 234, 0.95); padding: 0.45em 0.9em; border-radius: 999px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22); }
#counters .c { display: inline-flex; align-items: center; gap: 0.4em; }
#counters .c b { min-width: 1.6em; text-align: center; color: #fff; background: var(--good); padding: 0.15em 0.35em; border-radius: 0.3em; font-variant-numeric: tabular-nums; transition: background 0.3s; }
#counters .c.bad b { background: var(--bad); }

/* addendum 2026-10-25 "show, don't tell": the default view shows objects, text is a tiny hint. T (body.t) brings back the presenter text:
   the 4-step card + roster, full tag text, the header line and the counter words, at the old (>= 22 px) sizes. */
#legend .n { font-variant-numeric: tabular-nums; }
body:not(.t) #legAi, body:not(.t) #legHuman, body:not(.t) #total, body:not(.t) #counters .c > span, body:not(.t) .zl .za { display: none; }
body.t #legend .n { display: none; }
body:not(.t) #legend { font-size: max(16px, 1.1vw); }
body:not(.t) #counters { font-size: max(16px, 1.1vw); gap: 0.9em; }
body:not(.t) #counters .c::before { font-size: 1.2em; }
#counters .c:nth-child(1)::before { content: "🧍"; } #counters .c:nth-child(2)::before { content: "📋"; } #counters .c:nth-child(3)::before { content: "⏰"; }
body.t #counters .c::before { content: none; }
body:not(.t) .zl { font-size: max(13px, 0.9vw); padding: 0.3em 0.45em; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2); }
body:not(.t) .tg { font-size: max(14px, 1vw); padding: 0.3em 0.5em; }
body:not(.t) .tg.bar { min-width: 4em; }
#tags .tg.nm { font: 700 max(12px, 0.8vw)/1 var(--font); color: #fff; background: rgba(31, 95, 174, 0.85); padding: 0.25em 0.5em; box-shadow: none; }
body:not(.t) .tg.think { padding-left: 1.9em; letter-spacing: 0.15em; min-width: 3.6em; }
/* sound-off review 2026-10-25: zone view gets the zone name (small, top-left) and one word per counter icon; robot name chips >= 20 px at 1280x720 */
#zname { position: fixed; left: 1.6vw; top: calc(2.4vh + max(16px, 1.1vw) * 2.6); z-index: 6; display: none; font: 800 max(16px, 1.1vw)/1 var(--font); color: #fff; background: rgba(43, 36, 31, 0.82); padding: 0.35em 0.65em; border-radius: 999px; }
#counters .cs { display: none; font-style: normal; font-size: 0.8em; color: #6a5f57; }
body.zv:not(.t) #zname, body.zv:not(.t) #counters .cs { display: inline-block; }
#tags .tg.nm { font-size: max(15px, 1.05vw); padding: 0.3em 0.55em; background: rgba(31, 95, 174, 0.95); }
</style>
